[binaries]
c = ['clang-18', '--target=aarch64-linux-android34', '--sysroot=/ndk/sysroot', '-resource-dir=/ndk/lib/clang/18', '-fuse-ld=lld', '--rtlib=compiler-rt', '-Qunused-arguments']
cpp = ['clang++-18', '--target=aarch64-linux-android34', '--sysroot=/ndk/sysroot', '-resource-dir=/ndk/lib/clang/18', '-fuse-ld=lld', '--rtlib=compiler-rt', '-Qunused-arguments', '-stdlib=libc++', '-static-libstdc++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables']
ar = 'llvm-ar-18'
strip = 'llvm-strip-18'
pkg-config = ['env', 'PKG_CONFIG_LIBDIR=/nonexistent', '/usr/bin/pkg-config']
[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'armv8'
endian = 'little'
